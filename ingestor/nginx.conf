# Serves the HLS output written to the webroot (the entrypoint rewrites `root`
# when --nginx_webroot is given).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        types {
            application/vnd.apple.mpegurl m3u8;
            video/iso.segment             m4s;
            video/mp4                     mp4 cmfv m4v;
            video/mp2t                    ts;
            audio/aac                     aac;
        }
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;

        # Live playlists change every segment: never cache them.
        location ~ \.m3u8$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, max-age=1" always;
        }
    }
}
