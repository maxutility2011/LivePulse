# Example LivePulse ingestor deployments - one container per live stream.
#   docker compose -f ingestor/docker-compose.yml up -d --build
# Each service publishes its ingest port and Nginx (HLS output) on its own host port.
services:
  # SRT push (listener): encoders send to srt://<host>:9000
  ingest-cam1:
    build: .
    image: livepulse-ingestor
    command: >-
      --input_url "srt://0.0.0.0?latency=500000"
      --port 9000 --stream_id cam1 --segment_seconds 6
    ports:
      - "9000:9000/udp"   # SRT is UDP
      - "8081:80"         # http://<host>:8081/cam1/index.m3u8
    tmpfs:
      - /tmp/lp_storage   # per-GOP scratch space
    restart: unless-stopped

  # RTMP push: encoders publish to rtmp://<host>:1935/live/cam2
  ingest-cam2:
    image: livepulse-ingestor
    command: --input_url rtmp://0.0.0.0/live/cam2 --port 1935 --stream_id cam2
    ports:
      - "1935:1935"
      - "8082:80"
    tmpfs:
      - /tmp/lp_storage
    restart: unless-stopped

  # HLS pull -> GCS (credentials: a mounted service-account key)
  # ingest-cdn1:
  #   image: livepulse-ingestor
